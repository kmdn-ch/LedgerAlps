run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - bodyclose
    - noctx
    - sqlclosecheck
    # gofmt a longtemps ete DESACTIVE, sur un diagnostic errone.
    #
    # Le commentaire disait « pre-existing files have Windows CRLF
    # inconsistencies; run gofmt manually ». Le symptome etait reel : sur un
    # poste Windows avec core.autocrlf=true, l'arbre de travail est en CRLF,
    # gofmt refuse le CRLF, et « gofmt -l . » signale donc TOUS les fichiers.
    #
    # Mais le depot, lui, STOCKE du LF -- verifie octet par octet sur les 211
    # fichiers .go : zero CR. C'est ce que la CI recupere sur un runner Linux,
    # et gofmt n'y signale rien. Le linteur ne cassait pas la CI ; il cassait
    # une verification LOCALE sur Windows, et on l'a desactive pour tout le
    # monde. La consigne de remplacement -- « run gofmt manually » -- n'etait
    # appliquee par rien, et treize fichiers avaient derive.
    - gofmt
  disable:
    - exhaustive
    - wrapcheck
    - nlreturn
    - gci
    - godot
    - godox
    - funlen
    - cyclop
    - gocognit
    # misspell: multilingual codebase (French/Swiss comments, British spellings like
    # "cancelled" are valid in this context)
    - misspell

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
      # unusedwrite: Contact.IsActive is scanned from DB but not used in PDF rendering —
      # acceptable pattern for partial struct population
      - unusedwrite
  staticcheck:
    checks: ["all", "-SA1019"]

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    # Test files have less strict requirements
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
    # Migration files are SQL, not Go
    - path: internal/db/migrations
      linters:
        - all
    # Generated files
    - path: ".*\\.pb\\.go"
      linters:
        - all
    # tx.Rollback in deferred error paths — the error is secondary to the
    # primary error already being returned; suppress to avoid noise.
    - linters:
        - errcheck
      text: "Error return value of `.*Rollback` is not checked"
    # Integration tests use http.NewRequest without context (pre-existing pattern)
    - path: internal/integration/integration_test\.go
      linters:
        - noctx
