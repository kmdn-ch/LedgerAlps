name: Release

on:
  push:
    tags:
      - "v*"
  # Rejouer une publication à la main, sur un tag déjà poussé.
  #
  # Un tag créé sur le dépôt ne déclenche pas toujours ce workflow : c'est
  # arrivé deux fois de suite sur v1.5.0-rc7 et rc8, tous deux bien présents
  # dans `git ls-remote` mais sans aucun `CreateEvent` ni run associé. Sans ce
  # point d'entrée, la seule issue était d'inventer un numéro de version de
  # plus — ce qui laisse derrière soi des tags sans publication et rend
  # l'historique des versions mensonger.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: "v2.6.1"

jobs:
  goreleaser:
    name: GoReleaser (Linux + Windows x86-64 binaries)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog

      # Lancé à la main, il faut avoir choisi un TAG et pas une branche.
      #
      # GoReleaser refuse de publier depuis une branche, mais son refus parle de
      # « git state » sans dire ce qu'il fallait sélectionner. Le dire ici coûte
      # quatre lignes et évite de chercher dans un journal de build.
      - name: Une publication part d'un tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error title=Ce n'est pas un tag::« ${GITHUB_REF_NAME} » est une ${GITHUB_REF_TYPE}."
            echo "Relancez ce workflow en choisissant un tag (vXYZ) dans la liste des références."
            exit 1
          fi
          echo "Publication demandée à la main pour le tag ${GITHUB_REF_NAME}."

      # A tag is branch-agnostic in git, so `git tag v1.4.0` while sitting on a
      # feature branch would publish unvalidated code as a real release. Final
      # releases must therefore be reachable from main.
      #
      # Pre-release tags (v1.4.0-rc1) are exempt on purpose: cutting a release
      # candidate from `test` is how a release is rehearsed end to end, and
      # goreleaser's `prerelease: auto` keeps it off the "Latest" badge.
      - name: Verify the tag is releasable
        run: |
          TAG="${GITHUB_REF_NAME}"
          # `--` terminates option parsing: the pattern starts with a hyphen and
          # grep would otherwise read it as a flag, silently failing to match and
          # subjecting release candidates to the main-only check.
          if printf '%s' "$TAG" | grep -qE -- '-(rc|alpha|beta|pre)'; then
            echo "$TAG is a pre-release — branch check skipped."
            exit 0
          fi
          # No --depth here: the checkout above already uses fetch-depth: 0, so
          # the clone is complete. `--depth=0` is not "unlimited" — git rejects
          # it outright ("depth 0 is not a positive number"), which is how this
          # guard broke the very first final release it was asked to check.
          git fetch origin main --quiet
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG is on main — proceeding."
          else
            echo "::error title=Tag not on main::$TAG points at a commit that is not on main."
            echo "Final releases ship from main only (see docs/BRANCHING.md)."
            echo "To rehearse from another branch, run the 'Release (dry run)' workflow,"
            echo "or tag a release candidate such as ${TAG}-rc1."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        # --no-package-lock prevents creating/modifying package-lock.json,
        # which would make the git worktree dirty and fail goreleaser's dirty check.
        run: cd frontend && npm install --no-package-lock

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    name: Windows NSIS Installer
    runs-on: windows-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: |
          # Check if NSIS is already present (pre-installed on some runner images)
          if (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') {
            Write-Host "NSIS already installed at default path"; exit 0
          }
          # Try winget (built-in on all GitHub Windows runners, no rate-limit)
          Write-Host "Installing NSIS via winget..."
          winget install NSIS.NSIS `
            --silent --accept-package-agreements `
            --accept-source-agreements --disable-interactivity 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "winget install succeeded"
          } else {
            # Fall back: choco with 3 retries and 15 s back-off
            Write-Host "winget failed, retrying with choco..."
            $installed = $false
            for ($i = 1; $i -le 3; $i++) {
              choco install nsis -y --no-progress 2>&1
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              Write-Host "choco attempt $i failed — waiting 15 s..."
              Start-Sleep -Seconds 15
            }
            if (-not $installed) { exit 1 }
          }
          # Ensure NSIS directory is on PATH for the build step
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (Test-Path $nsisDir) {
            Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
            Write-Host "Added to PATH: $nsisDir"
          }

      - name: Download Windows binaries from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
        shell: bash
        run: |
          # GoReleaser .Version strips the leading 'v' (e.g. v1.1.0 → 1.1.0)
          VERSION_NUM="${VERSION#v}"
          # Download and extract the windows amd64 zip from the release
          gh release download "$VERSION" \
            --pattern "ledgeralps_${VERSION_NUM}_windows_amd64.zip" \
            --dir installer-work
          cd installer-work
          unzip -o "ledgeralps_${VERSION_NUM}_windows_amd64.zip"

      - name: Stage installer files
        shell: bash
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          VERSION_NUM="${VERSION#v}"
          STAGE="infrastructure/windows"
          # Binaries only — frontend is embedded inside ledgeralps-server.exe
          cp installer-work/ledgeralps-server.exe "$STAGE/"
          cp installer-work/ledgeralps.exe         "$STAGE/"
          cp installer-work/ledgeralps-cli.exe     "$STAGE/"
          echo "Staged files:"
          ls -lh "$STAGE/"

      # Deux fichiers atteignent l'ecran de l'installeur, chacun avec sa regle.
      #
      # installer.nsi doit garder son BOM UTF-8 : sans lui makensis lit le
      # script dans la codepage ANSI et les accents francais sont massacres
      # (« donnAes »).
      #
      # LICENSE doit rester en ASCII pur. L'installeur est en `Unicode True`,
      # mais NSIS ne lit un fichier de licence en UTF-8 que s'il porte un BOM.
      # On n'en met pas ici : un BOM perturbe les detecteurs de licence
      # (GitHub licensee, scanners SPDX) et ce fichier part aussi dans les
      # paquets .deb et .rpm. Un tiret demi-cadratin dans « 2024-2026 » s'est
      # ainsi affiche « 2024a EUR"2026 » sur la page de licence de la v1.4.2.
      #
      # Les deux regressions ont deja eu lieu : controlees avant chaque build.
      - name: Check installer text encoding
        shell: pwsh
        run: |
          $nsi = [System.IO.File]::ReadAllBytes("infrastructure/windows/installer.nsi")
          if ($nsi[0] -ne 0xEF -or $nsi[1] -ne 0xBB -or $nsi[2] -ne 0xBF) {
            throw "installer.nsi a perdu son BOM UTF-8 - les accents seront corrompus dans l'installeur."
          }
          $lic = [System.IO.File]::ReadAllBytes("LICENSE")
          $bad = @(for ($i = 0; $i -lt $lic.Length; $i++) { if ($lic[$i] -gt 0x7F) { $i } })
          if ($bad.Count -gt 0) {
            throw "LICENSE contient un octet non-ASCII (offset $($bad[0])) - il s'affichera en mojibake sur la page de licence de l'installeur. Remplacer par l'equivalent ASCII."
          }
          Write-Host "installer.nsi : BOM UTF-8 present. LICENSE : ASCII pur."

      - name: Build NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          $versionNum = $env:VERSION -replace '^v', ''
          # Locate makensis: choco adds it to PATH, fall back to common install dirs
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
            $makensis = @(
              'C:\Program Files (x86)\NSIS\makensis.exe',
              'C:\Program Files\NSIS\makensis.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw "makensis.exe not found — check NSIS installation" }
          Write-Host "Using makensis: $makensis"
          Set-Location "infrastructure\windows"
          & $makensis /DVERSION="$versionNum" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
        shell: bash
        run: |
          installer=$(ls infrastructure/windows/LedgerAlps_Setup_*.exe)
          gh release upload "$VERSION" "$installer" --clobber
