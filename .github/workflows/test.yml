name: CI

on:
  push:
    # `test` is the integration branch: work is validated there before being
    # promoted to `main`, so it must get exactly the same checks as `main`.
    branches: [main, test]
  pull_request:

permissions:
  # Aucun droit d'écriture : ces workflows lisent le dépôt et rapportent. Les
  # trois autres déclarent déjà les leurs ; sans bloc, on hérite du défaut du
  # dépôt, qui reste « read and write » sur tout dépôt créé avant février 2023.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server
        run: go build ./cmd/server

      - name: Build CLI
        run: go build ./cmd/cli

      - name: Build launcher (cross-compile for Windows)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-H=windowsgui" ./cmd/launcher

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84  # v6.5.2
        with:
          # Version FIXE, et non « latest » : sinon le linteur change sous nos
          # pieds et une CI verte devient rouge sans qu'aucune ligne du depot
          # ait bouge. install-mode: goinstall lance un `go install` ; sans
          # version epinglee, c'est un `@latest` non verifie a chaque execution.
          # v1.64.8, derniere de la serie 1.x : le .golangci.yml du depot est
          # au schema v1 (« linters-settings: »), que golangci-lint v2 refuse.
          # Passer a v2 demande de reecrire la configuration -- c'est une
          # decision, pas un epinglage, et elle ne se prend pas ici.
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m
