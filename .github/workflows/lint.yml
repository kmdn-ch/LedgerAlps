name: Lint

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  # Aucun droit d'écriture : ces workflows lisent le dépôt et rapportent. Les
  # trois autres déclarent déjà les leurs ; sans bloc, on hérite du défaut du
  # dépôt, qui reste « read and write » sur tout dépôt créé avant février 2023.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84  # v6.5.2
        with:
          # Version FIXE, et non « latest » : sinon le linteur change sous nos
          # pieds et une CI verte devient rouge sans qu'aucune ligne du depot
          # ait bouge. install-mode: goinstall lance un `go install` ; sans
          # version epinglee, c'est un `@latest` non verifie a chaque execution.
          # v1.64.8, derniere de la serie 1.x : le .golangci.yml du depot est
          # au schema v1 (« linters-settings: »), que golangci-lint v2 refuse.
          # Passer a v2 demande de reecrire la configuration -- c'est une
          # decision, pas un epinglage, et elle ne se prend pas ici.
          version: v1.64.8
          # goinstall compiles golangci-lint with the installed Go toolchain (1.26),
          # so it can lint modules targeting go1.26 without version mismatch errors.
          install-mode: goinstall
          # verify: false retire une dépendance RÉSEAU du build.
          #
          # L'étape « config verify » télécharge un schéma JSON depuis
          # golangci-lint.run pour valider .golangci.yml. Le 5 août 2026, cette
          # requête a expiré et le build a échoué sur un commit parfaitement
          # sain — le même a réussi au réessai, sans qu'une ligne ait changé.
          #
          # Un build qui échoue parce qu'un site externe était lent apprend à
          # réessayer plutôt qu'à lire l'échec, et c'est ainsi qu'on finit par
          # ignorer un vrai échec. La contrepartie est mince : une erreur dans
          # ce fichier se manifeste de toute façon au lancement des linters,
          # une seconde plus tard.
          verify: false
          args: --timeout=5m --config=.golangci.yml

  deadcode:
    name: Code inatteignable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # Pourquoi ce job EN PLUS de golangci-lint.
      #
      # Le linteur « unused » est bien active dans .golangci.yml, et il est
      # vert. Mais il ne signale que les identifiants NON EXPORTES : une
      # fonction exportee que plus rien n'appelle lui echappe par construction.
      #
      # Le troisieme audit en a trouve sept, dont un constructeur garde par un
      # commentaire qui le justifiait « pour les tests qui n'exercent que
      # l'analyse du XML » — alors que sa seule occurrence dans tout le depot
      # etait sa propre definition. Un commentaire faux coute plus cher qu'un
      # commentaire absent : il fait renoncer a verifier.
      #
      # deadcode raisonne par ATTEIGNABILITE depuis les points d'entree, ce qui
      # est le seul angle qui attrape ce cas. Le drapeau -test compte les tests
      # comme points d'entree : sans lui, tout ce qui n'est appele que par un
      # test serait signale a tort.
      #
      # Version epinglee, comme golangci-lint et les actions : un outil qui
      # change sous nos pieds rend rouge une CI qu'aucune ligne du depot n'a
      # fait bouger.
      - name: deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.38.0
          sortie=$(deadcode -test ./...)
          if [ -n "$sortie" ]; then
            echo "Fonctions inatteignables :"
            echo "$sortie"
            echo
            echo "Retirez-les, ou expliquez pourquoi elles restent — mais"
            echo "verifiez d'abord que l'explication est vraie."
            exit 1
          fi
          echo "Aucune fonction inatteignable."

  mod-check:
    name: Module hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.sum is up to date
        run: go mod verify
