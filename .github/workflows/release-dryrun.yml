name: Release (dry run)

# Répétition complète d'une release SANS rien publier.
#
# Produit exactement les mêmes artefacts que `release.yml` — binaires Linux et
# Windows x86-64, paquets .deb/.rpm, installeur NSIS — mais les dépose comme
# artefacts de workflow au lieu de créer une GitHub Release. Rien n'apparaît
# publiquement, aucun tag n'est posé.
#
# À lancer depuis n'importe quelle branche (typiquement `test`) :
#   gh workflow run "Release (dry run)" --ref test
# ou via Actions → Release (dry run) → Run workflow.
#
# Pourquoi c'est nécessaire : `release.yml` se déclenche sur tout tag `v*`,
# quelle que soit la branche, et `.goreleaser.yaml` a `draft: false`. Poser un
# tag pour « voir si ça passe » publie donc une release réelle et visible.

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: "Construire aussi l'installeur Windows NSIS"
        type: boolean
        default: true

permissions:
  contents: read # aucune écriture : ce workflow ne publie rien

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GORELEASER_VERSION: "v2.6.1"

jobs:
  build:
    name: Build artefacts (snapshot)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0 # GoReleaser a besoin de l'historique complet

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Install frontend dependencies
        # npm ci, et non npm install --no-package-lock.
        #
        # `ci` installe EXACTEMENT le verrou committe, echoue si package.json et
        # package-lock.json divergent, et ne modifie jamais le verrou -- il ne
        # salit donc pas l'arbre de travail que goreleaser controle, ce qui
        # etait la raison invoquee pour --no-package-lock. Sans verrou, l'arbre
        # npm etait resolu a neuf a chaque publication et le JavaScript embarque
        # dans le binaire n'etait ni reproductible ni auditable.
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      # --snapshot ignore l'absence de tag et n'appelle jamais l'API GitHub :
      # les artefacts sont écrits dans dist/ et rien n'est publié.
      # syft produit le SBOM declare dans .goreleaser.yaml (bloc `sboms`).
      # Sans lui sur le runner, goreleaser echoue au moment de l'ecrire.
      #
      # On installe le BINAIRE publie, avec son empreinte, et non le script
      # install.sh du depot amont. La forme precedente relisait ce script
      # depuis la branche `main` d'anchore/syft -- une branche mouvante, sans
      # empreinte -- et versait son contenu dans `sh`, dans un job portant
      # `contents: write` et le GITHUB_TOKEN. La VERSION de l'outil etait
      # epinglee ; le script qui l'installe ne l'etait pas, ce qui laissait a
      # quiconque pousse sur cette branche l'execution de code dans le job qui
      # construit et publie les binaires LedgerAlps.
      - name: Install syft (SBOM)
        env:
          SYFT_VERSION: "1.18.1"
        run: |
          set -euo pipefail
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive"   "${base}/${archive}"
          curl -sSfL --retry 3 -o syft.sums    "${base}/syft_${SYFT_VERSION}_checksums.txt"
          # grep puis sha256sum -c : l'empreinte doit CORRESPONDRE, et l'absence
          # de la ligne doit echouer aussi (d'ou le grep, qui rend 1 si vide).
          grep " ${archive}$" syft.sums | sha256sum -c -
          tar -xzf "$archive" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          rm -f "$archive" syft.sums syft
          syft --version

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

      # La version snapshot est dérivée par goreleaser
      # (snapshot.version_template : {{ incpatch .Version }}-dev+{{ .ShortCommit }}),
      # on la relit depuis les métadonnées plutôt que de la recalculer.
      - name: Extract snapshot version
        id: version
        run: |
          version=$(jq -r '.version' dist/metadata.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version snapshot : $version"

      - name: Summarise artefacts
        run: |
          {
            echo "### Artefacts construits (non publiés)"
            echo ""
            echo '```'
            ls -lh dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*checksums* 2>/dev/null || ls -lh dist/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dryrun-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*checksums*
          retention-days: 7
          if-no-files-found: error

  windows-installer:
    name: Windows NSIS Installer (dry run)
    runs-on: windows-latest
    needs: build
    if: inputs.build_installer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install NSIS
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') {
            Write-Host "NSIS already installed at default path"
          } else {
            winget install NSIS.NSIS `
              --silent --accept-package-agreements `
              --accept-source-agreements --disable-interactivity 2>&1
            if ($LASTEXITCODE -ne 0) {
              choco install nsis -y --no-progress 2>&1
              if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
            }
          }
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (Test-Path $nsisDir) { Add-Content -Path $env:GITHUB_PATH -Value $nsisDir }

      # Différence clé avec release.yml : les binaires viennent de l'artefact du
      # job précédent, pas d'une GitHub Release — puisqu'aucune n'existe.
      - name: Download binaries from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dryrun-binaries
          path: installer-work

      - name: Stage installer files
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd installer-work
          zip=$(ls ledgeralps_*_windows_amd64.zip)
          echo "Archive Windows : $zip"
          unzip -o "$zip"
          cd ..
          STAGE="infrastructure/windows"
          cp installer-work/ledgeralps-server.exe "$STAGE/"
          cp installer-work/ledgeralps.exe         "$STAGE/"
          cp installer-work/ledgeralps-cli.exe     "$STAGE/"
          ls -lh "$STAGE/"

      # Deux fichiers atteignent l'ecran de l'installeur, chacun avec sa regle.
      #
      # installer.nsi doit garder son BOM UTF-8 : sans lui makensis lit le
      # script dans la codepage ANSI et les accents francais sont massacres
      # (« donnAes »).
      #
      # LICENSE doit rester en ASCII pur. L'installeur est en `Unicode True`,
      # mais NSIS ne lit un fichier de licence en UTF-8 que s'il porte un BOM.
      # On n'en met pas ici : un BOM perturbe les detecteurs de licence
      # (GitHub licensee, scanners SPDX) et ce fichier part aussi dans les
      # paquets .deb et .rpm. Un tiret demi-cadratin dans « 2024-2026 » s'est
      # ainsi affiche « 2024a EUR"2026 » sur la page de licence de la v1.4.2.
      #
      # Les deux regressions ont deja eu lieu : controlees avant chaque build.
      - name: Check installer text encoding
        shell: pwsh
        run: |
          $nsi = [System.IO.File]::ReadAllBytes("infrastructure/windows/installer.nsi")
          if ($nsi[0] -ne 0xEF -or $nsi[1] -ne 0xBB -or $nsi[2] -ne 0xBF) {
            throw "installer.nsi a perdu son BOM UTF-8 - les accents seront corrompus dans l'installeur."
          }
          $lic = [System.IO.File]::ReadAllBytes("LICENSE")
          $bad = @(for ($i = 0; $i -lt $lic.Length; $i++) { if ($lic[$i] -gt 0x7F) { $i } })
          if ($bad.Count -gt 0) {
            throw "LICENSE contient un octet non-ASCII (offset $($bad[0])) - il s'affichera en mojibake sur la page de licence de l'installeur. Remplacer par l'equivalent ASCII."
          }
          Write-Host "installer.nsi : BOM UTF-8 present. LICENSE : ASCII pur."

      - name: Build NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # NSIS refuse les caractères '+' dans un nom de fichier de sortie ;
          # la version snapshot contient '-dev+<sha>', on ne garde donc que la
          # partie numérique pour le nom de l'installeur.
          $versionNum = ($env:VERSION -replace '^v', '') -replace '\+.*$', ''
          Write-Host "Version installeur : $versionNum"
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
            $makensis = @(
              'C:\Program Files (x86)\NSIS\makensis.exe',
              'C:\Program Files\NSIS\makensis.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw "makensis.exe not found" }
          Set-Location "infrastructure\windows"
          & $makensis /DVERSION="$versionNum" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dryrun-windows-installer
          path: infrastructure/windows/LedgerAlps_Setup_*.exe
          retention-days: 7
          if-no-files-found: error
