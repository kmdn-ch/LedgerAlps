    <!--
      Aucune ressource externe ici, volontairement.

      Cette page chargeait ses polices depuis fonts.googleapis.com : chaque
      ouverture transmettait l'adresse IP de l'utilisateur à Google, ce qui
      contredit la promesse « vos données restent sur votre machine » et pose
      un problème nLPD/RGPD (le tribunal régional de Munich a jugé cette
      pratique contraire au RGPD en janvier 2022).

      Ces polices ne se chargeaient de toute façon jamais : la CSP du serveur
      (style-src 'self') bloque la feuille de style distante. L'application a
      donc toujours été rendue avec les polices système — les retirer ne change
      rien à l'affichage, mais supprime l'appel réseau.

      Si la typographie d'origine (DM Sans / Syne / JetBrains Mono) est
      souhaitée, il faut embarquer les fichiers woff2 dans le binaire, pas les
      charger depuis un tiers.
    -->
  </head>
