version: 2

project_name: ledgeralps

before:
  hooks:
    # Copy the built frontend into the embed path before `go build`.
    # The CI runs `npm run build` before goreleaser, so frontend/dist/ exists.
    - bash -c "mkdir -p internal/frontend/dist && cp -r frontend/dist/. internal/frontend/dist/"

# Supported platforms: windows/amd64 and linux/amd64 — nothing else.
#
# macOS and every ARM variant were dropped after v1.4.1. They were produced
# because cross-compiling them is free, not because they were tested: no macOS
# or ARM machine exists in CI or in the project, so those artefacts shipped
# unverified. The windows/arm64 archive made the cost concrete — it contained
# only ledgeralps-cli.exe, with no server and no launcher, so anyone who
# downloaded the file named for their architecture got an unusable package.
# Publishing a binary is a promise it works; these could not keep it.
builds:
  - id: ledgeralps-server
    main: ./cmd/server
    binary: ledgeralps-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/kmdn-ch/ledgeralps/version.version={{.Version}}
      - -X github.com/kmdn-ch/ledgeralps/version.commit={{.Commit}}
      - -X github.com/kmdn-ch/ledgeralps/version.date={{.CommitDate}}
      - -X github.com/kmdn-ch/ledgeralps/version.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Windows server — built separately so -H=windowsgui can be applied cleanly.
  # The launcher redirects all server output to %APPDATA%\LedgerAlps\server.log,
  # so no console window is needed.
  - id: ledgeralps-server-windows
    main: ./cmd/server
    binary: ledgeralps-server
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -H=windowsgui
      - -X github.com/kmdn-ch/ledgeralps/version.version={{.Version}}
      - -X github.com/kmdn-ch/ledgeralps/version.commit={{.Commit}}
      - -X github.com/kmdn-ch/ledgeralps/version.date={{.CommitDate}}
      - -X github.com/kmdn-ch/ledgeralps/version.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Windows launcher — GUI entry point (setup wizard + browser opener).
  # Built only for Windows; uses -H=windowsgui to suppress the console window.
  - id: ledgeralps-launcher
    main: ./cmd/launcher
    binary: ledgeralps
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -H=windowsgui
      - -X github.com/kmdn-ch/ledgeralps/version.version={{.Version}}
      - -X github.com/kmdn-ch/ledgeralps/version.commit={{.Commit}}
      - -X github.com/kmdn-ch/ledgeralps/version.date={{.CommitDate}}
      - -X github.com/kmdn-ch/ledgeralps/version.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: ledgeralps-cli
    main: ./cmd/cli
    binary: ledgeralps-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/kmdn-ch/ledgeralps/version.version={{.Version}}
      - -X github.com/kmdn-ch/ledgeralps/version.commit={{.Commit}}
      - -X github.com/kmdn-ch/ledgeralps/version.date={{.CommitDate}}
      - -X github.com/kmdn-ch/ledgeralps/version.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ledgeralps
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The launcher is Windows-only, so the Windows archive has 3 binaries
    # (server + cli + launcher) while the Linux archive has 2. This is
    # intentional — allow_different_binary_count suppresses the goreleaser check.
    #
    # Keep this flag narrow in scope: it is also what let the windows/arm64
    # archive ship with a single binary and no warning. With the matrix reduced
    # to two platforms, a missing binary is now visible in the asset sizes.
    allow_different_binary_count: true
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - scripts/install.sh

nfpms:
  - id: ledgeralps-packages
    package_name: ledgeralps
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: LedgerAlps
    homepage: https://github.com/kmdn-ch/ledgeralps
    maintainer: LedgerAlps Team <hello@ledgeralps.ch>
    description: |-
      LedgerAlps — Swiss SME Accounting Platform.
      Double-entry accounting with Swiss compliance (CO 957a/958f), QR-bill (SPC 0200),
      ISO 20022 payments (pain.001/camt.053), and TVA declarations.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: finance
    priority: optional
    scripts:
      preinstall: infrastructure/linux/preinstall.sh
      postinstall: infrastructure/linux/postinstall.sh
      preremove: infrastructure/linux/preremove.sh
      postremove: infrastructure/linux/postremove.sh
    contents:
      - src: infrastructure/linux/ledgeralps.service
        dst: /lib/systemd/system/ledgeralps.service
        file_info:
          mode: 0644
      - src: .env.example
        dst: /etc/ledgeralps/ledgeralps.env.example
        type: config|noreplace
        file_info:
          mode: 0600
    recommends:
      - postgresql-client

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Security"
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^chore\\(release\\):"
      - "^chore: merge"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: kmdn-ch
    name: ledgeralps
  draft: false
  prerelease: auto
  name_template: "LedgerAlps {{.Tag}}"
  # Note: no Docker instructions here. docker-compose.yml existed only to run
  # the Python/FastAPI implementation superseded in v1.0.0 and was removed with
  # it, so "docker compose up -d" pointed at a file that no longer exists.
  footer: |
    ## Installation

    **Windows — recommandé**

    Téléchargez `LedgerAlps_Setup_{{ .Version }}_windows_amd64.exe` ci-dessous,
    puis double-cliquez. L'assistant s'occupe du reste : au premier lancement,
    LedgerAlps ouvre votre navigateur et vous demande de créer votre compte.

    Vos données sont enregistrées dans `%APPDATA%\LedgerAlps\` et sont conservées
    lors des mises à jour comme des désinstallations.

    **Linux (x86-64)**

    ```bash
    curl -fsSL https://raw.githubusercontent.com/kmdn-ch/ledgeralps/main/scripts/install.sh | bash
    ```

    Paquets `.deb` et `.rpm` également disponibles ci-dessous.
    Pour un déploiement serveur (systemd, PostgreSQL, sauvegardes), voir
    [docs/PRODUCTION.md](https://github.com/kmdn-ch/LedgerAlps/blob/main/docs/PRODUCTION.md).

    **Plateformes prises en charge**

    Windows x86-64 et Linux x86-64 uniquement. macOS et les processeurs ARM
    ne sont plus publiés depuis la v1.4.1 : ces binaires étaient produits sans
    être testés, faute de machine correspondante. Sur un PC Windows ARM, c'est
    l'installeur x86-64 ci-dessous qu'il faut utiliser — Windows l'exécute par
    émulation.

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"
